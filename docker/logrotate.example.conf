# Ejemplo de configuración de logrotate para los logs persistentes de GEMA/AntLog
# Copiar (ajustando rutas si es necesario) a /etc/logrotate.d/gema-antlog en el servidor

/var/lib/docker/volumes/animal_register_backend_logs/_data/app.log {
    daily          # rotar una vez por día
    rotate 14      # conservar 14 archivos viejos (~2 semanas)
    compress       # comprimir logs antiguos
    missingok      # no fallar si el archivo no existe
    notifempty     # no rotar si está vacío
    copytruncate   # copiar y truncar sin reiniciar el proceso Node
}

/var/lib/docker/volumes/animal_register_frontend_logs/_data/app.log {
    daily
    rotate 14
    compress
    missingok
    notifempty
    copytruncate
}

# Nginx suele escribir varios archivos dentro de /var/log/nginx
/var/lib/docker/volumes/animal_register_nginx_logs/_data/*.log {
    daily
    rotate 14
    compress
    missingok
    notifempty
    copytruncate
}
